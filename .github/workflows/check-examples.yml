name: Example copies

# `examples/invoice_check.py` is a byte-for-byte copy of mock-sap's, because
# example code is not importable across repositories and the alternative is
# forking logic that is tested there. This notices when the copy stops being
# one.
#
# On push and pull request *and* daily. Unlike release-check.yml, a push trigger
# is wanted: a pull request that edits the copy should fail on that pull request,
# where the person who edited it is looking. But per-push alone would not be
# enough, because the drift comes from *another repository* - mock-sap can move
# for weeks without a commit here to trigger anything.
#
# Its own workflow rather than a step in ci.yml, so the daily run is one small
# job instead of the whole nine-way test matrix.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 07:10 UTC, ten minutes after release-check.yml, so two unrelated watchdogs
    # do not report at the same moment and get read as one problem.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copies:
    name: example copies match their source repositories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The copies still match the originals
        # --require, so that being unable to reach GitHub is a failure here
        # rather than a pass. Locally the same command skips instead, which is
        # what keeps a contributor with no network from being blocked by a check
        # that has nothing to do with their change.
        run: python3 tools/check_examples.py --require
