name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is not in the tool cache on ubuntu-latest any more
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          # The newest interpreter turns deprecation warnings into failures:
          # with no dependencies, nothing but this project's own code can
          # raise one, so the next removal is met while it is still a warning.
          - {os: ubuntu-latest, python: "3.14", warnings: error::DeprecationWarning}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every module
        run: python -m compileall -q mockbank tests examples tools
      - name: Run the test suite
        run: python -X faulthandler -m unittest discover -s tests -v
        env:
          PYTHONWARNINGS: ${{ matrix.warnings }}
          MOCKBANK_TEST_WATCHDOG: "600"

  docs:
    name: documentation covers every file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog check compares against the base of the pull request,
          # so it needs more than the tip commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py
      - name: The changelog is well formed and has lost nothing
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$BASE" in 0000000000000000000000000000000000000000) BASE="";; esac
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          python tools/check_changelog.py ${BASE:+--base "$BASE"} --labels "$LABELS"

  smoke:
    name: documented examples still work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the documented curl tour
        run: |
          set -eu
          python -m mockbank --port 8080 -q &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/_mock/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8080/_mock/health
          bash examples/demo.sh

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel and run the console script
        run: |
          set -eu
          python -m pip install dist/*.whl
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$(mock-bank --version)" = "mock-bank $VERSION"
          test "$(cd /tmp && python -c 'import mockbank; print(mockbank.__version__)')" = "$VERSION"
          mock-bank --port 8081 -q &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8081/_mock/health && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:8081/_mock/state | head -c 400
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  docker:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mock-bank:ci .
      - name: Run it and ask for its health
        run: |
          set -eu
          docker run -d --name mock-bank -p 8080:8080 mock-bank:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/_mock/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8080/_mock/state
          docker rm -f mock-bank
