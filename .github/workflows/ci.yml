name: CI

on:
  push:
    branches: [main]
  # `labeled` and `unlabeled` are here for one reason: two of the changelog
  # check's rules are lifted by a label - `no changelog` for the one about a
  # package change bringing an entry, `changelog rewrite` for the one about an
  # entry losing text - and the workflow reads the labels from the event.
  # Without them, applying the label ran nothing, and re-running the failed job
  # reused the original event - which had no label - so the only way to get a
  # run that saw it was to close and reopen the pull request. That happened on
  # #37.
  #
  # It does mean any label change re-runs everything. The concurrency group
  # below is keyed on the ref, which for a pull request is refs/pull/N/merge,
  # so a label change cancels the run in progress for that pull request rather
  # than queueing a second one beside it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.8 is not in the tool cache on ubuntu-latest any more
          - {os: ubuntu-22.04, python: "3.8"}
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          # The newest interpreter turns deprecation warnings into failures:
          # with no dependencies, nothing but this project's own code can
          # raise one, so the next removal is met while it is still a warning.
          - {os: ubuntu-latest, python: "3.14", warnings: error::DeprecationWarning}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every module
        run: python -m compileall -q mockbank tests examples tools
      - name: Run the test suite
        run: python -X faulthandler -m unittest discover -s tests -v
        env:
          PYTHONWARNINGS: ${{ matrix.warnings }}
          MOCKBANK_TEST_WATCHDOG: "600"

  docs:
    name: documentation covers every file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog check compares against the base of the pull request,
          # so it needs more than the tip commit.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py
      - name: The dictionary and the mock's output agree with the published XSDs
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils; }
          python tools/check_xsd.py --require
      - name: The changelog and its fragments are well formed
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$BASE" in 0000000000000000000000000000000000000000) BASE="";; esac
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          python tools/check_changelog.py ${BASE:+--base "$BASE"} --labels "$LABELS"

  smoke:
    name: documented examples still work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the documented curl tour
        run: |
          set -eu
          python -m mockbank --port 8090 -q &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8090/_mock/health >/dev/null && break
            sleep 0.25
          done
          bash examples/demo.sh
      - name: Run the example client against a fresh mock
        run: |
          set -eu
          python -m mockbank --port 8082 -q &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8082/_mock/health >/dev/null && break
            sleep 0.25
          done
          python examples/client.py --base http://127.0.0.1:8082
      - name: The tour again, against a mock trading through a folder
        run: |
          set -eu
          mkdir -p /tmp/bank/in /tmp/bank/out
          python -m mockbank --port 8084 -q \
            --drop-dir /tmp/bank/in --pickup-dir /tmp/bank/out &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8084/_mock/health >/dev/null && break
            sleep 0.25
          done
          BASE=http://127.0.0.1:8084 bash examples/demo.sh >/dev/null
          # The tour goes in over HTTP; the pickup directory is the bank's
          # outbound side either way, so its answers have to be on disk.
          ls /tmp/bank/out | grep -q '^pain.002' \
            || { echo "no pain.002 in the pickup directory"; ls -la /tmp/bank/out; exit 1; }
          # And a file dropped in the folder goes through the same pipeline.
          cp tests/samples/pain001_four_payments.xml /tmp/bank/in/dropped.xml
          # Asking for a scan rather than only waiting, but asserting the
          # *outcome* rather than which reader got there first: the poller runs
          # every --drop-interval-ms and may well have taken the file already,
          # in which case the scan honestly reports nothing to do. Either way
          # the file ends up filed away and its payments in the bank, and that
          # is the claim worth making.
          sleep 1
          curl -sS -X POST http://127.0.0.1:8084/_mock/drop/scan >/dev/null
          for _ in $(seq 1 20); do
            test -f /tmp/bank/in/processed/dropped.xml && break
            sleep 0.5
          done
          test -f /tmp/bank/in/processed/dropped.xml \
            || { echo "dropped file was not filed away"; find /tmp/bank/in; exit 1; }
          curl -sf http://127.0.0.1:8084/_mock/payments \
            | python -c "import json,sys; p=json.load(sys.stdin); \
                         assert len(p) >= 4, len(p); \
                         print('the folder fed the pipeline:', len(p), 'payments')"
      - name: Both again, against a mock that wants credentials
        run: |
          set -eu
          python -m mockbank --port 8083 -q --auth tester:s3cret &
          MOCK_PID=$!
          trap 'kill $MOCK_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -sf -u tester:s3cret http://127.0.0.1:8083/_mock/health >/dev/null \
              && break
            sleep 0.25
          done
          # The tour and the client each take credentials through one variable
          # rather than having a second version of themselves. If that ever
          # stops being true, it stops here rather than in someone's terminal.
          BASE=http://127.0.0.1:8083 BANK_AUTH=tester:s3cret bash examples/demo.sh
          BANK_AUTH=tester:s3cret python examples/client.py \
            --base http://127.0.0.1:8083

  package:
    name: package builds and installs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel and run the console script
        run: |
          set -eu
          python -m pip install dist/*.whl
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$(mock-bank --version)" = "mock-bank $VERSION"
          test "$(cd /tmp && python -c 'import mockbank; print(mockbank.__version__)')" = "$VERSION"
          mock-bank --port 8081 -q &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8081/_mock/health >/dev/null && break
            sleep 0.25
          done
          # Not a health check: the installed console script has to take a real
          # payment file and answer for it. A wheel that starts and cannot do
          # the one thing the package is for has still shipped broken.
          curl -sS -X POST --data-binary @tests/samples/pain001_four_payments.xml \
            http://127.0.0.1:8081/payments \
            | python -c "import json,sys; a=json.load(sys.stdin); \
                         assert a['status']=='PART', a; \
                         assert a['accepted']==2 and a['rejected']==2, a; \
                         print('the wheel took a file:', a['status'])"
          curl -sf http://127.0.0.1:8081/_mock/state | head -c 400
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
      - name: The suite passes from an unpacked sdist
        run: |
          set -eu
          # #163. The sdist ships the tests, so it has to ship what they read as
          # well - and `MANIFEST.in` says that by extension, which is how 98
          # tests came to depend on `.ach` files that were never in it. Run from
          # the unpacked tree, in a directory of its own, so nothing of the
          # checkout can answer for a file the archive left out.
          mkdir -p /tmp/from-sdist
          tar -xzf dist/*.tar.gz -C /tmp/from-sdist
          cd /tmp/from-sdist/mock_bank-*
          python -m unittest discover -s tests
      - name: The examples are importable from the installed wheel
        run: |
          set -eu
          # #169. From /tmp, so the repository's own `examples/` cannot answer
          # instead of the wheel, and with nothing but mock-bank installed.
          cd /tmp
          python - <<'PY'
          from mockbank.examples import client, statement
          import mockbank.examples
          # The worked integrations moved to rseufert/mock-acme. Asking for one
          # has to say where it went, not only that it is missing.
          for name in mockbank.examples.MOVED:
              try:
                  getattr(mockbank.examples, name)
              except ImportError as moved:
                  assert "mock-acme" in str(moved), moved
              else:
                  raise SystemExit("mockbank.examples.%s is still in the wheel" % name)
          print("mockbank.examples imports from the wheel:", client.__file__)
          PY

  docker:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mock-bank:ci .
      - name: Run it and ask for its health
        run: |
          set -eu
          docker run -d --name mock-bank -p 8090:8090 mock-bank:ci \
            --auth tester:s3cret
          for _ in $(seq 1 40); do
            curl -sf -u tester:s3cret http://127.0.0.1:8090/_mock/health >/dev/null && break
            sleep 0.5
          done
          curl -sf -u tester:s3cret http://127.0.0.1:8090/_mock/state
          # The image binds 0.0.0.0, which is what --auth is for: an
          # unauthenticated request to the running container has to be refused,
          # and the credentials have to work through the published port. This is
          # the one place that pair is checked where it actually matters.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/_mock/reset -X POST)
          test "$code" = "401" || { echo "expected 401 without credentials, got $code"; exit 1; }
          docker logs mock-bank 2>&1 | grep -q "WARNING" \
            && { echo "warned about exposure despite --auth"; exit 1; } || true
          docker rm -f mock-bank
      - name: Without --auth it says so, because the image binds 0.0.0.0
        run: |
          set -eu
          docker run -d --name mock-bank-open -p 8081:8090 mock-bank:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8081/_mock/health >/dev/null && break
            sleep 0.5
          done
          docker logs mock-bank-open 2>&1 | grep -q "WARNING - listening on 0.0.0.0 with no --auth" \
            || { echo "no exposure warning from a container with no --auth"; docker logs mock-bank-open; exit 1; }
          docker rm -f mock-bank-open

  # The one check the `main` ruleset requires (docs/GITHUB.md). The matrix
  # names above are generated and change whenever the matrix does, so requiring
  # them by name would break on the next Python release; this name is fixed.
  #
  # `if: always()` is the point. Without it this job is *skipped* when a job it
  # needs fails, and a required check that was skipped counts as passed. So it
  # always runs, and fails unless every job it needs succeeded - a cancelled or
  # skipped one is a failure too, since no job here skips on purpose.
  all:
    name: CI passed
    if: always()
    needs: [test, docs, smoke, package, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this workflow runs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {name: job["result"] for name, job in needs.items()
                 if job["result"] != "success"}
          if bad:
              sys.exit("not passed: %s" % ", ".join(
                  "%s %s" % pair for pair in sorted(bad.items())))
          print("all %d jobs succeeded" % len(needs))
          PY
